
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain For Sale</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: #60a5fa;
      overflow-wrap: anywhere;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 1.5rem;
    }

    p {
      color: #aab4c3;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="domain"></h1>
    <h2>This Domain Is For Sale</h2>
    <p id="message"></p>

    <a class="button" id="contact">Contact Us</a>
    <p id="email"></p>
  </div>

  <script>
    // =====================================
    // EDIT THESE SETTINGS FOR EACH DOMAIN
    // =====================================

    const DOMAIN = "outdoorsmansoutlet.com";
    const EMAIL = "alex@farebros.com";
    const MESSAGE =
      "Interested in purchasing this domain? " +
      "Contact us to discuss pricing and availability.";

    // =====================================
    // NO NEED TO EDIT BELOW THIS LINE
    // =====================================

    document.getElementById("domain").textContent = DOMAIN;
    document.getElementById("message").textContent = MESSAGE;
    document.getElementById("email").textContent = EMAIL;

    document.getElementById("contact").href =
      "mailto:" + EMAIL +
      "?subject=" +
      encodeURIComponent("Domain Purchase Inquiry: " + DOMAIN);

    document.title = DOMAIN + " - For Sale";
  </script>
</body>
</html>
